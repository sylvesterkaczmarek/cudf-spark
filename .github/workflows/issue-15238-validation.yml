name: Issue 15238 isolated validation
on:
  push:
    branches: [validation/issue-15238-20261107]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'sylvesterkaczmarek/cudf-spark'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.0.1
      - name: Audit usages and reproduce the fix
        run: python .github/issue-15238-validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marker-validation
          include-hidden-files: true
          retention-days: 7
          path: |
            .validation/
            integration_tests/src/main/python/conftest.py
            integration_tests/src/main/python/allow_non_gpu_validation_test.py
  preserve_validated_blobs:
    needs: validate
    if: github.repository == 'sylvesterkaczmarek/cudf-spark'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: marker-validation
          path: validated
      - name: Preserve only the two tested file objects for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request
          files = ['integration_tests/src/main/python/conftest.py', 'integration_tests/src/main/python/allow_non_gpu_validation_test.py']
          result = {}
          for name in files:
              body = json.dumps({'encoding': 'utf-8', 'content': (pathlib.Path('validated') / name).read_text()}).encode()
              request = urllib.request.Request('https://api.github.com/repos/sylvesterkaczmarek/cudf-spark/git/blobs', data=body, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  result[name] = json.load(response)['sha']
          print('VALIDATED_BLOBS=' + json.dumps(result, sort_keys=True))
          PY
